<html>
<head>
    <meta charset="UTF-8">
    <title>Formularz</title>
    <style>
        body {
            text-align: center;
        }

        form {
            display: inline-block;
            border: 2px solid black;
            padding: 20px;
            text-align: left;
            border-radius: 12px;
            width: 320px;
        }

        input {
            float: right;
        }

        input[type="radio"] {
            float: none;
        }

        .radio-options {
            float: right;
        }

        br {
            clear: both;
        }

        .buttons {
            text-align: center;
            margin-top: 15px;
            clear: both;
        }

        .buttons input[type="submit"] {
            background-color: #4CAF50; 
            color: white;               
            padding: 6px 14px;
            border-radius: 5px;
        }

        .buttons input[type="reset"] {
            background-color: #af4c4c; 
            color: white;               
            padding: 6px 14px;
            border-radius: 5px; 
        }
    </style>
</head>
<body>
    <h1>Formularz</h1>

    <form>
        <label>Imię:</label>
        <input type="text" name="imie">

        <br>

        <label>Nazwisko:</label>
        <input type="text" name="nazwisko">

        <br>

        <label>Ulica:</label>
        <input type="text" name="ulica">

        <br>

        <label>Miasto:</label>
        <input type="text" name="miasto">

        <br>

        <label>Hasło:</label>
        <input type="password" name="haslo">

        <br>

        <label>Data urodzenia:</label>
        <input type="date" name="data">

        <br>

        <label>Telefon:</label>
        <input type="tel" name="telefon">

        <br>

        <label>Email:</label>
        <input type="email" name="email">

        <br>

        <label>Uwagi:</label>
        <input type="text" name="uwagi">

        <br>

        <label>Prawo jazdy:</label>
        <span class="radio-options">
            <input type="radio" name="prawo_jazdy" value="tak"> Tak
            <input type="radio" name="prawo_jazdy" value="nie"> Nie
        </span>

        <br>

        <div class="buttons">
            <input type="reset" value="Wyczyść">
            <input type="submit" value="Wyślij">
        </div>
    </form>

</html>
