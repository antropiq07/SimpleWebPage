<html>
<head>
    <meta charset="UTF-8">
    <title>Formularz</title>
</head>
<body>
    <h1>Formularz</h1>

    <form>
        <label>Imię:</label><br>
        <input type="text" name="imie">
        <br>

        <label>Nazwisko:</label><br>
        <input type="text" name="nazwisko">
        <br>

        <label>Ulica:</label><br>
        <input type="text" name="ulica">
        <br>

        <label>Miasto:</label><br>
        <input type="text" name="miasto">
        <br>

        <label>Hasło:</label><br>
        <input type="password" name="haslo">
        <br>

        <label>Data urodzenia:</label><br>
        <input type="date" name="data">
        <br>

        <label>Telefon:</label><br>
        <input type="tel" name="telefon">
        <br>

        <label>Email:</label><br>
        <input type="email" name="email">
        <br>

        <label>Uwagi:</label><br>
        <input type="text" name="uwagi">
        <br>

        <label>Prawo jazdy:</label><br>
        <input type="radio" name="prawo_jazdy" value="tak">
        Tak
        <input type="radio" name="prawo_jazdy" value="nie">
        Nie
        <br>

        <input type="submit" value="Wyślij">
        <input type="reset" value="Wyczyść">
    </form>
    
    <br><br>
    <a href="index.html">Strona główna</a>
</body>
</html>
